services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      USE_MOCK_REVERB: ${USE_MOCK_REVERB:-true}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-local-dev-secret}
    volumes:
      - ./backend/history/chat.db:/app/backend/history/chat.db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_WS_URL: ws://localhost/chat
    ports:
      - "80:80"
    depends_on:
      - backend
